<!doctype html>
<html><head><meta charset="utf-8">

<style>
  html,body{margin:0;width:1080px;height:1440px;overflow:hidden;background:#FCF6EA}
  .f{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
  .tag{position:absolute;top:118px;left:0;right:0;display:flex;justify-content:center}
  .tag div{background:#2F6F6A;color:#fff;font-weight:700;font-size:40px;padding:12px 36px;border-radius:40px;letter-spacing:2px}
