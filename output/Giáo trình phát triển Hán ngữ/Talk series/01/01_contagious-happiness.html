<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#23201c;--mute:#857c71;--line:#ebe4d9;--acc:#c4492d;--acc2:#2f6f6a;--soft:#f4efe7;--ok:#2e7d4f;--h6:#c4492d;--h6bg:#fbe9e4;--pat:#2f6f6a;--patbg:#e3f1ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a18;--card:#242220;--ink:#ece6dc;--mute:#a39a8e;--line:#36322d;--acc:#ec7a5c;--acc2:#6cc0b8;--soft:#2d2a26;--ok:#5fbf86;--h6:#f08a6c;--h6bg:#3a2a25;--pat:#6cc0b8;--patbg:#203432}}
:root[data-theme="dark"]{--bg:#1b1a18;--card:#242220;--ink:#ece6dc;--mute:#a39a8e;--line:#36322d;--acc:#ec7a5c;--acc2:#6cc0b8;--soft:#2d2a26;--ok:#5fbf86;--h6:#f08a6c;--h6bg:#3a2a25;--pat:#6cc0b8;--patbg:#203432}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
.zh{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.ttl{font-weight:700;font-size:17px}.ttl small{color:var(--mute);font-weight:400;margin-left:6px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 12px;cursor:pointer;font:inherit;font-size:14px}
.btn:hover{border-color:var(--acc)}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mode button{border:0;background:var(--card);color:var(--mute);padding:4px 12px;cursor:pointer;font:inherit;font-size:14px}
.mode button.on{background:var(--acc2);color:#fff}
.wrap{padding:16px 20px;display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
/* chế độ Chưa ai vào: không có cột Mục tiêu */

aside{position:sticky;top:64px;max-height:calc(100vh - 76px);overflow:auto}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(560px,92vw)}

.toast.on{opacity:1}
.v{display:flex;gap:6px;align-items:flex-start}.v .txt{flex:1;min-width:0}
.cp{border:0;background:none;cursor:pointer;opacity:.35;font-size:14px;padding:2px 4px;flex:none}.cp:hover{opacity:1}
.bh .cp{margin-top:4px}
@media (max-width:860px){aside{order:2}.st{grid-template-columns:1fr;gap:0}.st .k{padding-top:0}.bh .q{font-size:19px}header{padding:6px 10px}.wrap{padding:10px}}

.btn.dirty{border-color:var(--acc);color:var(--acc);font-weight:600}
.btn.dirty::after{content:" •"}
/* Bôi đen chữ Hán → popup pinyin + nghĩa (cùng cách với on-luyen.html) */
.cpall{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px;margin-left:auto}
#main [data-all] .v{padding:8px 0;border-top:1px dashed var(--line);font-size:17px;line-height:1.8}
.lookupPopup{position:fixed;z-index:200;max-width:300px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:14px 16px;font-size:13.5px;line-height:1.6}
.lookupPopup[hidden]{display:none}
.lookupPopup .lp-word{font-size:18px;font-weight:700;color:var(--acc)}
.lookupPopup .lp-pinyin{color:var(--mute);font-size:13px;margin:2px 0 8px}
.lookupPopup .lp-mean b{color:var(--mute);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:2px}
.lookupPopup .lp-close{position:absolute;top:6px;right:8px;cursor:pointer;color:var(--mute);font-size:13px;background:none;border:none;padding:4px}

</style>

<body>
<header>
  <div class="ttl zh" id="ttl"></div>
  <div class="sp"></div>
  <div class="mode" id="mode"><button data-m="group">👥 Có người vào</button><button data-m="solo">🙋 Chưa ai vào</button><button data-m="post">📝 Bài đăng</button></div>
  <button class="btn" id="btnPhone" title="Mở trang này trên điện thoại (cùng Wi-Fi)">📱 Điện thoại</button>
  <button class="btn" id="btnSave" title="Ghi tick + chat vào file, commit + push git để máy khác mở là làm tiếp">💾 Lưu + đồng bộ</button>
</header>
<div class="wrap">
  <aside id="goal"></aside>
  <main id="main"></main>
</div>
<dialog id="dlg"><p id="dlgT"></p><p><button class="btn" onclick="dlg.close()">Đóng</button></p></dialog>
<div class="toast" id="toast"></div>
<div class="lookupPopup" id="lookupPopup" hidden><button class="lp-close" id="lp-close" title="Đóng">✕</button><div id="lp-body"></div></div>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'talkseries:v4:ep' + D.ep;
try { const old = 'talkseries:v4:FZ-KY-B01'; if (D.ep === '01' && !localStorage.getItem(KEY) && localStorage.getItem(old)) localStorage.setItem(KEY, localStorage.getItem(old)); } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BL = Object.fromEntries([...D.blocks, ...D.solo_blocks].map(b => [b.id, b]));

/* chữ có đánh dấu → HTML (từ H6 / mẫu câu / slang bấm được) */
function rich(s, plain = false) {
  if (plain) return esc(s).replace(/\{p\d\|(.+?)\}/g, '$1').replace(/\{s\|(.+?)\}/g, '$1').replace(/\*\*(.+?)\*\*/g, '$1');
  return esc(s)
    .replace(/\{p(\d)\|(.+?)\}/g, (_, i, t) => `<span class="pt" data-p="${i}" title="Mẫu câu: ${esc(D.patterns[i].p)}">${t}</span>`)
    .replace(/\{s\|(.+?)\}/g, '$1')
    .replace(/\*\*(.+?)\*\*/g, (_, t) => `<span class="w" data-w="${t}">${t}</span>`);
}
const wordsIn = s => [...String(s).matchAll(/\*\*(.+?)\*\*/g)].map(m => m[1]);
const patsIn = s => [...String(s).matchAll(/\{p(\d)\|/g)].map(m => +m[1]);
const blockText = b => [b.q, b.story, b.follow, b.help, ...(b.paras || [])].join(' ');

/* ---------- trạng thái: lấy bản mới hơn giữa file (đã đồng bộ git) và trình duyệt này ---------- */
let S = {mode:'group', word:{}, pat:{}, blk:{}, shut:{}, chat:{}, ts:''};
const fromFile = Object.assign({}, D.room_state || {}, {chat: D.chat || {}});
let local = null; try { local = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
Object.assign(S, (local && (local.ts || '') >= (fromFile.ts || '')) ? local : fromFile);
let dirty = !!(local && (local.ts || '') > (fromFile.ts || ''));
const markSave = () => $('#btnSave')?.classList.toggle('dirty', dirty);
const save = () => { S.ts = new Date().toISOString(); dirty = true; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} markSave(); window.TS_onSave?.(); };
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2600); };

$('#ttl').innerHTML = `Tập ${esc(D.ep)} · ${esc(D.title_zh)}<small>${esc(D.title_vi)}</small>`;

/* ---------- theo chế độ ---------- */
const curBlocks = () => S.mode === 'solo' ? D.solo_blocks : D.blocks;
const introLines = () => [...(D.intro.fixed || []), ...[].concat(D.intro.group || [])];
const outroLines = () => D.outro ? [...(D.outro.fixed || []), ...(D.outro.group || []), ...(D.outro.fixed_end || [])] : [];
const curText = () => [...(S.mode === 'solo' ? [] : [...introLines(), ...outroLines()]), ...curBlocks().map(blockText)].join(' ');
const curWords = () => [...new Set(wordsIn(curText()))];
const curPats = () => [...new Set(patsIn(curText()))].sort();

/* ---------- đồng bộ tick: 1 chỗ đổi → mọi chỗ đổi ---------- */
function paint() {
  document.querySelectorAll('[data-w]').forEach(e => e.classList.toggle('on', !!S.word[e.dataset.w]));
  document.querySelectorAll('.pt[data-p]').forEach(e => e.classList.toggle('on', !!S.pat[e.dataset.p]));
  document.querySelectorAll('.ck input[data-p]').forEach(e => { e.checked = !!S.pat[e.dataset.p]; e.parentElement.classList.toggle('on', e.checked); });
  document.querySelectorAll('.blk').forEach(e => { const id = e.dataset.b; e.classList.toggle('done', !!S.blk[id]); e.querySelector('.tick').checked = !!S.blk[id]; });
  document.querySelectorAll('.ck input[data-b]').forEach(e => { e.checked = !!S.blk[e.dataset.b]; e.parentElement.classList.toggle('on', e.checked); });
  const W = curWords(), P = curPats(), L = curBlocks();
  const nW = W.filter(w => S.word[w]).length, nP = P.filter(i => S.pat[i]).length, nB = L.filter(b => S.blk[b.id]).length;
  const tot = W.length + P.length + L.length;
  $('#gW').textContent = `${nW}/${W.length}`; $('#gP').textContent = `${nP}/${P.length}`; $('#gB').textContent = `${nB}/${L.length}`;
  $('#gT').textContent = `${nW + nP + nB}/${tot}`; $('#gBar').style.width = ((nW + nP + nB) / tot * 100) + '%';
}
function setBlock(id, on) {
  S.blk[id] = on;
  const b = BL[id], ws = wordsIn(blockText(b)), ps = patsIn(blockText(b));
  if (on) { ws.forEach(w => S.word[w] = true); ps.forEach(i => S.pat[i] = true); }
  else {
    /* bỏ tick khối → bỏ luôn từ/mẫu câu của khối, trừ khi một khối khác đã xong cũng có */
    const other = Object.keys(S.blk).filter(k => S.blk[k] && k !== id && BL[k]).map(k => blockText(BL[k])).join(' ');
    const ow = new Set(wordsIn(other)), op = new Set(patsIn(other));
    ws.forEach(w => { if (!ow.has(w)) S.word[w] = false; }); ps.forEach(i => { if (!op.has(i)) S.pat[i] = false; });
  }
  save(); paint();
}
document.addEventListener('click', e => {
  const w = e.target.closest('.w[data-w], .chip[data-w]'); if (w) { S.word[w.dataset.w] = !S.word[w.dataset.w]; save(); paint(); return; }
  const p = e.target.closest('.pt[data-p]'); if (p) { S.pat[p.dataset.p] = !S.pat[p.dataset.p]; save(); paint(); }
});

/* ---------- cột Mục tiêu ---------- */
function renderGoal() {
  $('#goal').innerHTML = `<div class="card">
    <div class="lbl">Mục tiêu <b id="gT"></b></div><div class="bar"><div id="gBar"></div></div>
    <div class="goal" style="margin-top:12px"><div class="lbl">Từ khoá bài <b id="gW"></b></div>
      ${curWords().map(w => `<span class="chip zh" data-w="${esc(w)}">${esc(w)}</span>`).join('')}</div>
    <div class="goal"><div class="lbl">Mẫu câu bài khoá <b id="gP"></b></div>
      ${curPats().map(i => `<label class="ck zh"><input type="checkbox" data-p="${i}"><span>${esc(D.patterns[i].p)}<br><small>${esc(D.patterns[i].ex)}</small></span></label>`).join('')}</div>
    <div class="goal"><div class="lbl">${S.mode === 'solo' ? 'Đã đọc' : 'Nói hết gợi ý'} <b id="gB"></b></div>
      ${curBlocks().map(b => `<label class="ck"><input type="checkbox" data-b="${b.id}"><span>${esc(b.name)}</span></label>`).join('')}</div>
  </div>`;
  $('#goal').querySelectorAll('input[data-p]').forEach(i => i.onchange = () => { S.pat[i.dataset.p] = i.checked; save(); paint(); });
  $('#goal').querySelectorAll('input[data-b]').forEach(i => i.onchange = () => setBlock(i.dataset.b, i.checked));
}

/* ---------- khối ---------- */
const chatBox = id => `<div class="chat"><div class="msgs">${(S.chat[id] || []).map((m, i) => `<div class="msg zh"><span>${esc(m.t)}</span><time>${esc(String(m.at).slice(5))}</time><button data-del="${i}" title="Xoá">✕</button></div>`).join('')}</div>
  <input class="zh" data-chat="${id}" placeholder="Ghi lại: ý hay, cách nói hay, lỗi được sửa… (Enter)"></div>`;
const head = (b, title, nm = b.name) => `<div class="bh"><input type="checkbox" class="tick" title="Xong">
  <div class="q zh">${nm ? `<span class="nm">${esc(nm)}</span>` : ''}${title}</div><button class="cp" title="Copy">📋</button><button class="tg">${S.shut[b.id] ? '▸' : '▾'}</button></div>`;
const row = (k, v, cls = '') => `<div class="st ${cls}"><div class="k"><b>${k}</b></div><div class="v zh"><div class="txt">${v}</div><button class="cp" title="Copy">📋</button></div></div>`;
const line = t => `<p class="txt">${t}</p>`;
function blockCard(b) {
  let r = row('① Tui kể trước', rich(b.story), 'tell');
  const ask = [b.invite, b.follow].filter(Boolean);
  if (ask.length) r += row('② Mời', ask.map(t => `<p>${rich(t)}</p>`).join('') + '<p class="note">为什么这么说？ · 能举个例子吗？ · 我跟你正好相反……</p>');
  if (b.help) r += row('Họ chưa hiểu / bí', rich(b.help) + '<p class="note">没关系，想到了再说～</p>');
  return `<div class="card blk ${S.shut[b.id] ? 'shut' : ''}" data-b="${b.id}">${head(b, rich(b.q))}<div class="bb">${r}${chatBox(b.id)}</div></div>`;
}
function soloCard(b) {
  const r = `<div class="st tell" style="display:block;border-top:0"><div class="v zh"><div class="txt">${b.paras.map(p => `<p style="margin-bottom:10px">${rich(p, true)}</p>`).join('')}</div><button class="cp" title="Copy">📋</button></div></div>`;
  return `<div class="card blk ${S.shut[b.id] ? 'shut' : ''}" data-b="${b.id}">${head(b, esc(b.name), '').replace('<button class="cp" title="Copy">📋</button>', '')}<div class="bb">${r}</div></div>`;
}
function postSection(sec) {
  const parts = sec.parts.map(t => `<div class="v zh"><div class="txt">${esc(t).replace(/\n/g, '<br>')}</div><button class="cp" title="Copy">📋</button></div>`).join('');
  return `<div class="card" data-all="${esc(sec.parts.join('\n\n'))}"><div class="bh"><div class="q zh">${esc(sec.name)}</div><button class="cpall" title="Copy cả bài">📋 Copy cả bài</button></div><div class="bb">${parts}</div></div>`;
}
const lineCard = (title, lines) => `<h2>${title}</h2><div class="card">${lines.map((t, i) => `<div class="v zh intro"><span class="num">${'①②③④⑤⑥⑦⑧⑨'[i]}</span><div class="txt">${rich(t)}</div><button class="cp" title="Copy">📋</button></div>`).join('')}</div>`;
function renderMain() {
  if (S.mode === 'post') {
    $('#main').innerHTML = (D.post?.sections || []).map(postSection).join('');
    document.querySelectorAll('.cpall').forEach(b => b.onclick = () => copyText(b.closest('[data-all]').dataset.all));
    document.querySelectorAll('.v .cp').forEach(b => b.onclick = () => copyText(b.parentElement.querySelector('.txt').innerText.trim()));
    return paint();
  }
  const solo = S.mode === 'solo';
  let h = solo ? '' : lineCard('Mở đầu', introLines());
  if (solo) h += D.solo_blocks.map(soloCard).join('');
  else { for (const g of D.groups) h += `<h2>${esc(g.label)}</h2>` + g.blocks.map(id => blockCard(BL[id])).join(''); h += lineCard('Kết thúc', outroLines()); }
  $('#main').innerHTML = h;
  document.querySelectorAll('.blk').forEach(c => {
    const id = c.dataset.b;
    c.querySelector('.tick').onchange = e => setBlock(id, e.target.checked);
    const tg = () => { S.shut[id] = !S.shut[id]; save(); c.classList.toggle('shut', S.shut[id]); c.querySelector('.tg').textContent = S.shut[id] ? '▸' : '▾'; };
    c.querySelector('.tg').onclick = tg;
    c.querySelector('.q').onclick = e => { if (!e.target.closest('.w,.pt')) tg(); };
    const hc = c.querySelector('.bh .cp'); if (hc) hc.onclick = () => copyText(c.querySelector('.q').innerText.replace(c.querySelector('.nm')?.innerText || '', '').trim());
    const inp = c.querySelector('[data-chat]');
    if (inp) inp.onkeydown = e => {
      if (e.key !== 'Enter' || e.isComposing || !inp.value.trim()) return;
      (S.chat[id] ||= []).push({t: inp.value.trim(), at: new Date().toLocaleString('sv').slice(0, 16)}); save();
      const y = scrollY; renderMain(); scrollTo(0, y); $(`[data-chat="${id}"]`).focus();
    };
    c.querySelectorAll('[data-del]').forEach(x => x.onclick = () => { S.chat[id].splice(+x.dataset.del, 1); save(); const y = scrollY; renderMain(); scrollTo(0, y); });
  });
  document.querySelectorAll('.v .cp').forEach(b => b.onclick = () => copyText(b.parentElement.querySelector('.txt').innerText.trim()));
  paint();
}

/* ---------- copy (chạy được cả trên điện thoại qua http trong mạng nhà) ---------- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch(e) { const a = document.createElement('textarea'); a.value = t; a.setAttribute('readonly', ''); a.style.cssText = 'position:fixed;top:0;opacity:0'; document.body.appendChild(a); a.select(); a.setSelectionRange(0, t.length); document.execCommand('copy'); a.remove(); }
  toast('Đã copy');
}
function render() {
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === S.mode));
  document.querySelector('.wrap').classList.toggle('nogoal', S.mode !== 'group');
  renderGoal(); renderMain();
}
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { S.mode = b.dataset.m; save(); render(); scrollTo(0, 0); });

/* ---------- Lưu: ghi vào file + commit + push (cần mở trang bằng Mo-Talk-series.bat) ---------- */
const viaServer = location.protocol.startsWith('http');
$('#btnSave').onclick = async () => {
  if (!viaServer) {
    $('#dlgT').innerHTML = 'Trang đang mở trực tiếp từ file nên chưa đẩy lên git được.<br><br>Mở thư mục <b>Talk series</b> → bấm đúp <b>Mo-Talk-series.bat</b> → trang tự mở lại → bấm Lưu. Tick và chat vẫn còn nguyên.';
    return dlg.showModal();
  }
  const btn = $('#btnSave'); btn.disabled = true; btn.textContent = '⏳ Đang lưu…';
  try {
    const st = {mode: S.mode, word: S.word, pat: S.pat, blk: S.blk, shut: S.shut, ts: S.ts};
    const r = await fetch('/save', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({page: decodeURIComponent(location.pathname), chat: S.chat, room_state: st})});
    const j = await r.json(); toast(j.msg); if (j.saved) { dirty = false; markSave(); }
  } catch(e) { toast('Không gọi được máy chủ lưu — cửa sổ Mo-Talk-series.bat còn mở không?'); }
  btn.disabled = false; btn.textContent = '💾 Lưu + đồng bộ';
};
/* ---------- 📱 mở trên điện thoại (cùng Wi-Fi) ---------- */
$('#btnPhone').onclick = async () => {
  if (!viaServer) { $('#dlgT').innerHTML = 'Mở trang bằng <b>Mo-Talk-series.bat</b> trước, rồi bấm lại nút này.'; return dlg.showModal(); }
  try {
    const j = await (await fetch('/lan')).json();
    const url = j.base + location.pathname;
    let qr = '';
    if (window.qrcode) { const q = qrcode(0, 'M'); q.addData(url); q.make(); qr = q.createSvgTag({cellSize: 6, margin: 2, scalable: true}); }
    $('#dlgT').innerHTML = `Điện thoại vào <b>cùng Wi-Fi</b> với máy tính → quét mã:<div style="width:220px;background:#fff;padding:6px;border-radius:8px;margin:10px 0">${qr}</div><code>${esc(url)}</code><br><span class="note">Lần đầu Windows có thể hỏi cho phép Python dùng mạng → chọn “Private network”.</span>`;
  } catch(e) { $('#dlgT').textContent = 'Không lấy được địa chỉ mạng — cửa sổ Mo-Talk-series.bat còn mở không?'; }
  dlg.showModal();
};
markSave();
render();
</script>
<script>
/* Bôi đen chữ Hán → popup pinyin (pinyin-pro, offline sau khi tải) + nghĩa (MyMemory, cần internet). Không bật trong ô nhập. */
(function(){
  const MAX_LOOKUP_LEN = 30;
  const popup = document.getElementById('lookupPopup'), popupBody = document.getElementById('lp-body');
  const translateCache = new Map();
  let requestToken = 0, currentRect = null;
  const hideLookup = () => { popup.hidden = true; currentRect = null; };
  document.getElementById('lp-close').addEventListener('click', hideLookup);
  const isFormField = n => !!(n && n.closest && n.closest('input,textarea,[contenteditable="true"]'));
  const MEANING_OVERRIDES = {
    '不可否认': 'Không thể phủ nhận',
    '与此同时': 'Đồng thời, cùng lúc đó',
    '长此以往': 'Cứ kéo dài như vậy, nếu cứ tiếp diễn như thế',
    '归根结底': 'Nói cho cùng, xét đến cùng',
    '由此可见': 'Qua đó có thể thấy',
    '另辟蹊径': 'Tìm một hướng đi khác, mở lối riêng',
    '寄望于': 'Đặt hy vọng vào, kỳ vọng vào',
    '权衡利弊': 'Cân nhắc được mất, cân nhắc lợi hại',
    '诚然': 'Quả thật, đúng là (thừa nhận trước khi phản biện)',
    '值得注意的是': 'Điều đáng chú ý là',
    '换言之': 'Nói cách khác',
    '须知': 'Cần biết rằng, nên biết là',
    '正所谓': 'Đúng như câu người ta vẫn nói',
    '毕竟': 'Dù sao, xét cho cùng',
    '值得深思的是': 'Điều đáng suy ngẫm là',
    '可见一斑': 'Qua đó thấy được phần nào của cả vấn đề',
    '值得借鉴的是': 'Điều đáng học hỏi, tham khảo là',
    '殊不知': 'Nào ngờ, không ngờ rằng',
    '坐吃山空': 'Ngồi không ăn tiêu thì núi vàng cũng cạn (ăn bám mãi rồi cũng hết)',
    '不容忽视': 'Không thể xem nhẹ, không thể bỏ qua',
    '耐人寻味': 'Đáng để suy ngẫm, càng ngẫm càng thấy thú vị',
    '可谓': 'Có thể nói là',
    '罄竹难书': 'Nhiều vô kể, kể không xuể (tội lỗi/khuyết điểm quá nhiều)',
    '未免': 'Không tránh khỏi, có phần (hơi...)',
    '足见': 'Đủ thấy, đủ để chứng tỏ',
    '莫衷一是': 'Không ai thống nhất được, mỗi người một ý',
    '不谋而合': 'Không hẹn mà gặp, trùng hợp ăn ý',
    '宽带': 'Băng thông rộng (internet cáp quang/ADSL)',
    '手机': 'Điện thoại di động',
  };

  function translate(text){
    const key = 'zh|' + text;
    if(translateCache.has(key)) return translateCache.get(key);
    if(Object.prototype.hasOwnProperty.call(MEANING_OVERRIDES, text)){ const p = Promise.resolve(MEANING_OVERRIDES[text]); translateCache.set(key, p); return p; }
    if(window.TS_MEANING){ const p = window.TS_MEANING(text); translateCache.set(key, p); p.catch(() => translateCache.delete(key)); return p; }
    const mm = (q, pair) => fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${pair}`).then(r => { if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(d => { const t = d && d.responseData && d.responseData.translatedText; if(!t) throw new Error('empty'); return t; });
    const looksEnglish = s => /^[\x00-\x7F]+$/.test(s) && /[A-Za-z]{2}/.test(s);
    const p = mm(text, 'zh-CN|vi').then(t => {
      if(!looksEnglish(t)) return t;
      return mm(t, 'en|vi').then(v => looksEnglish(v) ? `${t} (tiếng Anh)` : v).catch(() => `${t} (tiếng Anh)`);
    });
    translateCache.set(key, p);
    return p;
  }
  function getPinyin(text){
    try{ if(window.pinyinPro && typeof window.pinyinPro.pinyin === 'function') return window.pinyinPro.pinyin(text, {toneType:'symbol', type:'string'}); }catch(e){}
    return '';
  }
  const escapeHtml = s => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function positionPopup(){
    if(!currentRect) return;
    const margin = 8, w = popup.offsetWidth, h = popup.offsetHeight;
    let left = currentRect.left, top = currentRect.bottom + margin;
    if(left + w > innerWidth - margin) left = innerWidth - w - margin;
    if(left < margin) left = margin;
    if(top + h > innerHeight - margin) top = currentRect.top - h - margin;
    if(top < margin) top = margin;
    popup.style.left = left + 'px'; popup.style.top = top + 'px';
  }
  function showLookup(text, rect){
    const myToken = ++requestToken;
    currentRect = rect;
    const G = (typeof D !== 'undefined' && D.gloss) || {};
    const key = G[text] ? text : (() => { const ks = Object.keys(G).filter(k => text.includes(k)).sort((a, b) => b.length - a.length); return ks.length && text.length - ks[0].length <= 2 ? ks[0] : ''; })();
    if(key){
      popupBody.innerHTML = `<div class="lp-word">${escapeHtml(text)}</div><div class="lp-pinyin">${escapeHtml(key === text ? G[key].py : getPinyin(text))}</div><div class="lp-mean"><b>Nghĩa${key === text ? '' : ' · ' + escapeHtml(key)}</b>${escapeHtml(G[key].vi)}</div>`;
      popup.hidden = false; positionPopup();
      return;
    }
    popupBody.innerHTML = `<div class="lp-word">${escapeHtml(text)}</div><div class="lp-pinyin">${escapeHtml(getPinyin(text)) || '—'}</div><div class="lp-mean" id="lp-mean-word"><b>Nghĩa</b><span class="lp-loading">đang tra…</span></div>`;
    popup.hidden = false; positionPopup();
    translate(text).then(t => {
      if(myToken !== requestToken) return;
      const el = document.getElementById('lp-mean-word'); if(el) el.innerHTML = `<b>Nghĩa</b>${escapeHtml(t)}`; positionPopup();
    }).catch(() => {
      if(myToken !== requestToken) return;
      const el = document.getElementById('lp-mean-word'); if(el) el.innerHTML = `<b>Nghĩa</b><span class="lp-loading">Không tra được (cần internet)</span>`; positionPopup();
    });
  }
  function handleSelection(){
    const sel = getSelection();
    if(!sel || sel.isCollapsed || sel.rangeCount === 0) return;
    const text = sel.toString().trim();
    if(!text || !/[一-鿿]/.test(text) || text.length > MAX_LOOKUP_LEN) return;
    const range = sel.getRangeAt(0);
    const el = n => n.nodeType === 3 ? n.parentElement : n;
    if(isFormField(el(range.startContainer)) || isFormField(el(range.endContainer))) return;
    showLookup(text, range.getBoundingClientRect());
  }
  document.addEventListener('mouseup', e => { if(!popup.contains(e.target)) setTimeout(handleSelection, 0); });
  document.addEventListener('touchend', () => setTimeout(handleSelection, 0));
  document.addEventListener('keyup', e => { if(e.shiftKey) setTimeout(handleSelection, 0); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') hideLookup(); });
  document.addEventListener('mousedown', e => { if(!popup.hidden && !popup.contains(e.target)) hideLookup(); });
  addEventListener('scroll', hideLookup, true);
})();
</script>
</body>
